[tools]
go = "1.27.3"
node = "26"
pnpm = "12"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:pressly/goose" = "3.29.0"
"aqua:evilmartians/lefthook" = "2.2.2"

[env]
_.file = "server/.env"

[hooks]
postinstall = "lefthook install"

[tasks.deps]
description = "Install server and web dependencies"
run = [
  "cd server && go mod download",
  "cd web && pnpm install --frozen-lockfile",
  "cd web && pnpm exec playwright install chromium",
]

[tasks.setup]
description = "First-time setup: deps, database, migrations"
depends = ["deps"]
run = ["mise run db:start", "mise run db:up"]

[tasks.tidy]
description = "Sync Go dependencies"
dir = "server"
run = "go mod tidy"

[tasks."dev:server"]
description = "Run server (dev)"
dir = "server"
run = "go build -o bin/server . && exec bin/server"

[tasks."dev:web"]
description = "Run web (dev)"
dir = "web"
run = "pnpm dev"

[tasks.dev]
description = "Run database, server and web (dev)"
run = """
mise run db:start
trap 'mise run db:stop' EXIT
mise run dev:server ::: dev:web
"""

[tasks.build]
description = "Build web and server"
run = [
  "cd web && BACKEND_URL= pnpm build",
  "cd server && go build -o bin/server .",
]

[tasks.start]
description = "Build and serve API + web on the LAN"
depends = ["build", "db:start"]
env = { HOST = "0.0.0.0", APP_ENV = "production" }
run = "bin/server"
dir = "server"

[tasks.lint]
description = "Run linters"
run = [
  "cd server && golangci-lint run",
  "cd web && pnpm lint && pnpm check",
]

[tasks.format]
description = "Format code"
run = ["cd server && go fmt ./...", "cd web && pnpm format"]

[tasks.test]
description = "Run lint, Go tests, Vitest and Playwright e2e (requires Docker)"
depends = ["lint"]
run = [
  "cd server && go test ./...",
  "cd web && pnpm test",
  "cd web && pnpm test:e2e",
]

[tasks."gen:api"]
description = "Generate web API types from the OpenAPI spec"
run = [
  "cd server && go run ./cmd/openapi > ../web/src/lib/api/openapi.json",
  "cd web && pnpm openapi-typescript src/lib/api/openapi.json -o src/lib/api/schema.d.ts",
  "cd web && pnpm prettier --write src/lib/api/openapi.json src/lib/api/schema.d.ts",
]

[tasks.seed]
description = "Create the first admin from ADMIN_* env vars (safe to re-run)"
dir = "server"
run = "go run ./cmd/seed"

[tasks."seed:sample"]
description = "Seed admin plus sample rubric, interview and candidates (sandbox only)"
dir = "server"
run = "go run ./cmd/seed -sample"

[tasks."db:start"]
description = "Start Postgres, wait until healthy, create the database if missing"
dir = "server"
# ponytail: db name is the last path segment of DATABASE_URL (no query params)
run = """
docker compose up -d --wait postgres
db="${DATABASE_URL##*/}"
docker compose exec -T postgres psql -U "$DB_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1 \
  || docker compose exec -T postgres createdb -U "$DB_USER" "$db"
"""

[tasks."db:stop"]
description = "Stop Postgres (data kept)"
dir = "server"
run = "docker compose stop"

[tasks."db:up"]
description = "Apply pending migrations"
dir = "server"
run = "goose up"

[tasks."db:down"]
description = "Roll back one migration"
dir = "server"
run = "goose down"

[tasks."db:status"]
description = "Show migration status"
dir = "server"
run = "goose status"

[tasks."db:create"]
description = "Create a new migration file (the only way to create one)"
usage = 'arg "<name>" help="Migration name"'
dir = "server"
run = 'goose create "$usage_name" sql'

[tasks."db:reset"]
description = "Wipe the database and re-run migrations (destructive, dev only)"
confirm = "This deletes all data. Continue?"
run = ["cd server && docker compose down -v", "mise run db:start", "mise run db:up"]
